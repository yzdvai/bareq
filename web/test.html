<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bareq ONNX check</title>
<style>
  body { font: 14px/1.5 ui-monospace, Menlo, monospace; margin: 24px; background: #f8f6f0; color: #222; }
  button { font: inherit; padding: 6px 14px; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Bareq: day-one ONNX check</h1>
<p>Loads the untrained model on WebGPU and WASM, checks the output against PyTorch and times one tile.</p>
<button id="go">Run</button>
<pre id="log"></pre>
<script type="module">
import * as ort from 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.1/dist/ort.webgpu.min.mjs';
ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.1/dist/';

const MODEL = '../export/bareq.onnx';
const logEl = document.getElementById('log');
const log = (s) => { logEl.textContent += s + '\n'; };
const results = { userAgent: navigator.userAgent, crossOriginIsolated, webgpuAvailable: !!navigator.gpu, runs: [] };
window.bareqResults = results;

async function f32(url) { return new Float32Array(await (await fetch(url)).arrayBuffer()); }

async function runBackend(ep, modelBytes, refIn, refOut) {
  const r = { ep };
  try {
    let t = performance.now();
    const sess = await ort.InferenceSession.create(modelBytes, { executionProviders: [ep] });
    r.createMs = Math.round(performance.now() - t);
    // correctness at 256
    const out = (await sess.run({ input: new ort.Tensor('float32', refIn, [1, 3, 256, 256]) })).output;
    const y = out.data;
    let maxd = 0, sumd = 0;
    for (let i = 0; i < y.length; i++) { const d = Math.abs(y[i] - refOut[i]); maxd = Math.max(maxd, d); sumd += d; }
    r.maxAbsDiff = maxd; r.meanAbsDiff = sumd / y.length;
    // timing: 1 warm-up + 3 runs per size
    r.ms = {};
    for (const s of [256, 512]) {
      const x = new ort.Tensor('float32', new Float32Array(3 * s * s).fill(0.5), [1, 3, s, s]);
      await sess.run({ input: x });
      const times = [];
      for (let k = 0; k < 3; k++) {
        t = performance.now();
        const o = await sess.run({ input: x });
        await o.output.getData?.();
        times.push(Math.round(performance.now() - t));
      }
      r.ms[s] = times;
    }
    await sess.release();
    r.ok = r.maxAbsDiff < 1e-3;
  } catch (e) {
    r.ok = false; r.error = String(e && e.message || e);
  }
  return r;
}

document.getElementById('go').onclick = async () => {
  logEl.textContent = '';
  log(`crossOriginIsolated=${crossOriginIsolated}  navigator.gpu=${!!navigator.gpu}  threads=${ort.env.wasm.numThreads ?? 'default'}`);
  const [modelBytes, refIn, refOut] = await Promise.all([
    fetch(MODEL).then(r => r.arrayBuffer()).then(b => new Uint8Array(b)),
    f32('../export/bareq.ref_in_256.bin'), f32('../export/bareq.ref_out_256.bin'),
  ]);
  log(`model ${(modelBytes.length / 1e6).toFixed(1)} MB`);
  for (const ep of ['webgpu', 'wasm']) {
    log(`\n== ${ep}`);
    const r = await runBackend(ep, modelBytes, refIn, refOut);
    results.runs.push(r);
    log(JSON.stringify(r, null, 1));
  }
  results.done = true;
  log('\ndone');
};
</script>
</body>
</html>
